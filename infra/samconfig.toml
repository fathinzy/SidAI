# SAM deployment config for SmartLorry.
# Region is pinned to the project's assigned region (ap-southeast-2 / Sydney).
version = 0.1

[default.global.parameters]
stack_name = "smartlorry"

[default.build.parameters]
cached = true
parallel = true

[default.deploy.parameters]
region = "ap-southeast-2"
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = true
stack_name = "smartlorry"
